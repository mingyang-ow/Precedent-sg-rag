name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install project
        run: uv sync --locked --extra dev --extra generation --extra api --python 3.12
      - name: Audit Python dependencies
        run: uv run pip-audit --skip-editable
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: quality
    env:
      PRECEDENT_CI_API_KEY: precedent-ci-service-key-123
      PRECEDENT_CI_METRICS_KEY: precedent-ci-metrics-key-456
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Install artifact builder
        run: uv sync --locked --extra generation --python 3.12
      - name: Build deterministic smoke artifacts
        run: uv run python tests/build_smoke_retrieval_artifacts.py /tmp/precedent-artifacts
      - name: Inspect published artifact permissions
        run: |
          stat --format='%A %a %u:%g %n' /tmp/precedent-artifacts
          find /tmp/precedent-artifacts -maxdepth 1 -type f \
            -exec stat --format='%A %a %u:%g %n' {} +
      - name: Build image
        run: docker build --tag precedent-sg-rag:ci .
      - name: Verify runtime credentials are absent from image metadata
        run: |
          docker image inspect precedent-sg-rag:ci > /tmp/image-inspect.json
          docker history --no-trunc precedent-sg-rag:ci > /tmp/image-history.txt
          ! grep --fixed-strings "$PRECEDENT_CI_API_KEY" /tmp/image-inspect.json
          ! grep --fixed-strings "$PRECEDENT_CI_API_KEY" /tmp/image-history.txt
          ! grep --fixed-strings "$PRECEDENT_CI_METRICS_KEY" /tmp/image-inspect.json
          ! grep --fixed-strings "$PRECEDENT_CI_METRICS_KEY" /tmp/image-history.txt
      - name: Verify configured user is non-root
        run: test "$(docker image inspect precedent-sg-rag:ci --format '{{.Config.User}}')" = "10001:10001"
      - name: Start read-only service
        run: >-
          docker run --detach --name precedent-ci --read-only --tmpfs /tmp:rw,noexec,nosuid,size=16m
          --volume /tmp/precedent-artifacts:/opt/precedent/retrieval-artifacts:ro
          --env PRECEDENT_API_KEY="$PRECEDENT_CI_API_KEY"
          --env PRECEDENT_METRICS_KEY="$PRECEDENT_CI_METRICS_KEY"
          --publish 8000:8000 precedent-sg-rag:ci
      - name: Verify non-root artifact access
        run: |
          docker exec precedent-ci id
          docker exec precedent-ci \
            stat --format='%A %a %u:%g %n' /opt/precedent/retrieval-artifacts
          docker exec precedent-ci \
            test -r /opt/precedent/retrieval-artifacts/manifest.json
          docker exec precedent-ci \
            test ! -w /opt/precedent/retrieval-artifacts
          docker exec precedent-ci \
            test ! -w /opt/precedent/retrieval-artifacts/manifest.json
      - name: Smoke health, readiness, and retrieval
        run: |
          ready_status=000
          for attempt in {1..30}; do
            if ready_status="$(curl --silent --show-error --output /tmp/ready.json \
              --write-out '%{http_code}' http://127.0.0.1:8000/ready)"; then
              if [ "$ready_status" = 200 ]; then
                break
              fi
            else
              ready_status=000
            fi
            if [ "$attempt" = 30 ]; then
              break
            fi
            sleep 1
          done
          echo "Readiness HTTP status: $ready_status"
          if [ -f /tmp/ready.json ]; then
            echo "Readiness response body:"
            sed -n '1,40p' /tmp/ready.json
          fi
          test "$ready_status" = 200
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          grep --quiet '"retrieval":true' /tmp/ready.json
          unauthenticated_retrieve_status="$(curl --silent --show-error \
            --output /tmp/unauthenticated-retrieve.json --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"facts":"objective contract","top_k":1}' \
            http://127.0.0.1:8000/retrieve)"
          test "$unauthenticated_retrieve_status" = 401
          grep --quiet '"code":"authentication_failed"' /tmp/unauthenticated-retrieve.json
          unauthenticated_metrics_status="$(curl --silent --show-error \
            --output /tmp/unauthenticated-metrics.json --write-out '%{http_code}' \
            http://127.0.0.1:8000/metrics)"
          test "$unauthenticated_metrics_status" = 401
          grep --quiet '"code":"authentication_failed"' /tmp/unauthenticated-metrics.json
          curl --fail --silent --show-error --output /tmp/metrics.txt \
            --header "X-Precedent-Metrics-Key: $PRECEDENT_CI_METRICS_KEY" \
            http://127.0.0.1:8000/metrics
          grep --quiet '^precedent_http_requests_total' /tmp/metrics.txt
          grep --quiet '^precedent_retrieval_ready 1.0$' /tmp/metrics.txt
          grep --quiet '^precedent_retrieval_documents ' /tmp/metrics.txt
          curl --fail --silent --show-error --header 'Content-Type: application/json' \
            --header "X-Precedent-API-Key: $PRECEDENT_CI_API_KEY" \
            --data '{"facts":"objective contract","top_k":1}' \
            http://127.0.0.1:8000/retrieve | grep --quiet '"case_id":"case:0"'
      - name: Show safe diagnostics on failure
        if: failure()
        run: |
          echo "Artifact permissions and ownership:"
          stat --format='%A %a %u:%g %n' /tmp/precedent-artifacts
          find /tmp/precedent-artifacts -maxdepth 1 -type f \
            -exec stat --format='%A %a %u:%g %n' {} +
          echo "Container logs:"
          docker logs precedent-ci
      - name: Stop service
        if: always()
        run: docker rm --force precedent-ci
