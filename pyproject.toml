[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "precedent-sg-rag"
version = "0.1.0"
description = "Reproducible evaluation of Singapore legal citation retrieval and grounded RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]
dense = [
  "sentence-transformers>=5.1,<6",
  "torch>=2.6,<3",
]
generation = [
  "openai>=2.20,<3",
  "pydantic>=2.10,<3",
  "tiktoken>=0.12,<1",
]

[project.scripts]
sg-legal-download = "sg_legal_rag.ingestion.download:main"
sg-legal-validate = "sg_legal_rag.ingestion.validation:main"
sg-legal-validate-benchmark = "sg_legal_rag.ingestion.benchmark_validation:main"
sg-legal-split = "sg_legal_rag.ingestion.splits:main"
sg-legal-bm25 = "sg_legal_rag.retrieval.benchmark:main"
sg-legal-dense = "sg_legal_rag.retrieval.dense_benchmark:main"
sg-legal-hybrid = "sg_legal_rag.retrieval.hybrid_benchmark:main"
sg-legal-rerank = "sg_legal_rag.retrieval.reranker_benchmark:main"
sg-legal-corpus-repair = "sg_legal_rag.retrieval.corpus_repair_benchmark:main"
sg-legal-rag-evaluate = "sg_legal_rag.generation.benchmark:main"
sg-legal-rag-cleanroom = "sg_legal_rag.generation.cleanroom_benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_legal_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
